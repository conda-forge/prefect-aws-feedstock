{% set name = "prefect-aws" %}
{% set version = "0.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/prefect_aws-{{ version }}.tar.gz
  sha256: 102bdd86fa87ef062ba74955371b28744ca7062d54995dc95340f284e36f8557

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=45
    - setuptools-scm >=6.2
  run:
    - python >={{ python_min }}
    - aiobotocore >=2.23.2
    - boto3 >=1.24.53
    - botocore >=1.27.53
    - mypy-boto3-s3 >=1.24.94
    - mypy-boto3-secretsmanager >=1.26.49
    - prefect >=3.8.4
    - pyparsing >=3.1.1
    - rich >=10.0.0
    - tenacity >=8.0.0
    - typer >=0.9.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - prefect_aws
  commands:
    - python -c "import importlib.metadata as m; v = m.version('prefect-aws'); assert v == '{{ version }}', v"
# Disable `pip check` until `prefect` adds `pip check` support
#  commands:
#    - pip check
#  requires:
#    - pip

about:
  home: https://github.com/PrefectHQ/prefect/tree/main/src/integrations/prefect-aws
  summary: Prefect collection of tasks and subflows to integrate with AWS
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  doc_url: https://docs.prefect.io/integrations/prefect-aws
  dev_url: https://github.com/PrefectHQ/prefect


extra:
  recipe-maintainers:
    - mikeoconnor0308
    - peterbygrave
    - skrsna
    - ahuang11
    - desertaxle
